tuning:
  # Selection objective:
  # - rmse
  # - loss
  # - rmse_phi
  # - combined (= rmse + rmse_phi)
  objective: loss

  methods:
    ot:
      ot_epsilon: [0.02, 0.05, 0.10, 25, 0.50, 1.0, 5.0, 10.0]
      ot_num_iters: [20, 40]
      train:
        steps: [100]
        lr: [1e-1]

    diffusion:
      diff_steps: [5, 10, 20]
      diff_a: [-0.001, -0.1, -1.0]
      train:
        steps: [100]
        lr: [1e-1]

    soft:
      lam: [0.2, 0.4, 0.6, 0.8, 0.95]
      train:
        steps: [100]
        lr: [1e-1]

    transformer:
      pretrained_weights: null
      d_model: [64, 128]
      hidden: [128, 256]
      num_heads: [4, 8]
      num_encoder_layers: [2]
      num_decoder_layers: [2]
      dropout_rate: [0.1]
      train:
        steps: [100]
        proposal_lr: [1e-1]
        resampler_lr: [5e-2]
