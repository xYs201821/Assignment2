experiment:
  output_root: results/exp4_vrnn_dpf
  experiment_name: exp4
  seeds: [0]
  T: 40
  batch_size: 1
  save_traces: true
  sim_seed_offset: 100000
  fit_seed_offset: 200000
  data:
    source: polyphonic   # synthetic | polyphonic
    datasets: [jsb_chorales]
    split: train
    root: data/polyphonic
    download: true
    max_sequences: 128
    shuffle: true

model:
  obs_dim: 88
  latent_dim: 8
  recurrent_dim: 16
  embed_dim: 32
  y_embed_dim: 32
  transition_hidden_dim: 64
  emission_hidden_dim: 64
  transition_r_std: 0.02
  deterministic_r: true
  deterministic_tol: 1e-6
  min_scale: 1e-3
  p0_diag: 1.0

training:
  steps: 300
  lr: 1e-3
  grad_clip_norm: 100.0
  log_every: 20
  mc_samples: 1

dpf:
  methods: [pf, soft, transformer]

  common:
    num_particles: 64
    ess_threshold: 0.5
    resample: auto
    stop_grad_through_time: false

  pf: {}

  soft:
    lam: 0.8

  ot:
    ot_epsilon: 0.1
    ot_num_iters: 50
    ot_jitter: 1e-6

  diffusion:
    diff_a: -0.1
    diff_T: 1.0
    diff_steps: 30
    diff_ode: true
    diff_eps: 1e-6

  transformer:
    d_model: 128
    hidden: 128
    num_heads: 4
    num_encoder_layers: 2
    num_decoder_layers: 1
    dropout_rate: 0.0
    freeze_resampler: false
    truncate_time_grad: true
