experiment:
  output_root: results/exp1_linear_gaussian
  T: 20
  batch_size: 50
  seeds: [42]
  dims: [36]
  dy_ratio: 0.25
  plot_kflow_marginals: false
  plot_kflow_seed0_only: false
  plot_kflow_show: false
  plot_kflow_time: 1
  plot_kflow_contour_method: kf
  plot_kflow_prior: false
  plot_kflow_obs_index: null
  plot_kflow_unobs_index: null
  plot_pf_degeneracy: false
  plot_pf_degeneracy_seed0_only: true
  plot_pf_degeneracy_show: false
  plot_pf_degeneracy_time: null
  plot_pf_ess: false
  plot_pf_ess_seed0_only: true
  plot_pf_ess_show: false
  plot_pf_obs_index: null
  plot_pf_unobs_index: null
  plot_stability: true
  plot_stability_seed0_only: true
  plot_stability_show: false
  plot_stability_percentiles: [25, 75]
model:
  alpha: 0.9
  alpha0: 1.0
  alpha1: 1.0
  beta: 20.0
  sigma_z: [0.5]
  p0_scale: 10.
filters:
  # `filters.*` is the canonical filter config namespace.
  methods:
    [
      edh(pfpf),
      ledh(pfpf),
      edh(pfpf_opt),
      ledh(pfpf_opt),
      stochastic_pf,
    ]
  model:
    # Optional filter-side observation-noise sweep.
    # length 1 => shared for all model.sigma_z;
    # length == len(model.sigma_z) => one-by-one mapping.
    # sigma_z: [0.6]
  ukf:
    alpha: 1e-1
    beta: 2.0
    kappa: 0.0
    jitter: 1e-6
  pf:
    num_particles: [10000]
    ess_threshold: 0.5
    reweight: always
  flow:
    num_particles: [500]
    num_lambda: 200
    ess_threshold: 0.5
    reweight: never
    beta_schedule_opt:
      mode: optimal
      mu: 0.2
      guard: true
  stochastic_pf:
    num_particles: 500
    num_lambda: 200
    ess_threshold: 0.5
    reweight: never
    resample: never
    diffusion: 0.01
    beta_schedule:
      mode: optimal
      mu: 0.2
      guard: true
    jitter: 1e-6
  kflow:
    optimizer: [adam]
    optimizer_eps: [1e-6]
    optimizer_beta_1: [0.9]
    optimizer_beta_2: [0.999]
    num_particles: [250]
    num_lambda: [100]
    alpha: [0.1]
    ll_grad_mode: [dist]
    alpha_update_every: [1]
    ds_init: [0.1]
    max_flow_norm: [null]
    localization_radius: [null]
